
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Solare & Stelle | Cuore al Centro</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; background: #0d1117; color: white; text-align: center; margin: 0; padding: 15px; }
        .container { max-width: 650px; margin: auto; background: #161b22; padding: 25px; border-radius: 20px; border: 1px solid #30363d; box-shadow: 0 8px 32px rgba(0,0,0,0.8); }
        h1 { color: #58a6ff; margin-bottom: 10px; font-size: 1.6rem; }
        h2 { color: #8b949e; font-size: 0.9rem; margin-bottom: 25px; font-weight: normal; }
        .input-box { background: #0d1117; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #30363d; }
        label { display: block; margin-bottom: 10px; font-weight: bold; color: #c9d1d9; }
        input, select { background: #21262d; border: 1px solid #30363d; color: white; padding: 12px; border-radius: 6px; width: 85%; font-size: 1.1rem; text-align: center; outline: none; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        td { padding: 14px 10px; border-bottom: 1px solid #21262d; text-align: left; font-size: 1.05rem; }
        .dist { text-align: right; font-family: 'Courier New', monospace; color: #79c0ff; font-weight: bold; }
        .star-section { margin-top: 30px; padding: 20px; border: 2px solid #f0883e; border-radius: 15px; background: rgba(240, 136, 62, 0.05); }
        #star-result { margin-top: 15px; padding: 15px; background: #21262d; border-radius: 10px; color: #ffa657; font-size: 1.1rem; min-height: 40px; line-height: 1.6; }
        .custom-input { background: #30363d !important; border: 1px dashed #f0883e !important; width: 40% !important; margin: 5px; font-size: 0.9rem !important; }
        footer { margin-top: 40px; padding-top: 20px; border-top: 1px solid #30363d; font-size: 0.85rem; color: #8b949e; }
        strong { color: #58a6ff; }
    </style>
</head>
<body>

<div class="container">
    <h1>Mappa delle Distanze Equivalenti 🚀</h1>
    <h2>Scale the Solar System & Beyond</h2>
    
    <div class="input-box">
        <label>Se la distanza Sole-Nettuno fosse di:</label>
        <input type="number" id="valoreBase" value="6" oninput="aggiorna()">
        <select id="unita" onchange="aggiorna()">
            <option value="m">Metri (m)</option>
            <option value="cm">Centimetri (cm)</option>
            <option value="km">Chilometri (km)</option>
        </select>
    </div>

    <table><tbody id="tabellaPianeti"></tbody></table>

    <div class="star-section">
        <h3 style="color:#f0883e; margin-top:0;">✨ Stelle e Galassie</h3>
        <label>Cerca nel database o inserisci i dati:</label>
        <input type="text" id="nomeStella" placeholder="Cerca stella (es: Sirio, Vega...)" oninput="aggiorna()">
        
        <div id="manual-input" style="margin-top:10px;">
            <p style="font-size:0.8rem; color:#8b949e; margin-bottom:5px;">Oppure inserisci Anni Luce manualmente:</p>
            <input type="number" id="lyManuale" class="custom-input" placeholder="Anni Luce" oninput="aggiorna()">
        </div>

        <div id="star-result">Inizia a scrivere...</div>
    </div>

    <footer>
        realizzato con l'I.A. su progetto di <strong>idolo tedesco</strong> (idolo58-Instagram) San Giorgio del Sannio.
    </footer>
</div>

<script>
    const AU_NETTUO = 30.06;
    const ANNO_LUCE_IN_AU = 63241.07;

    const corpi = [
        { it: "Mercurio 🌑", au: 0.39 }, { it: "Venere 🪐", au: 0.72 },
        { it: "Terra 🌍", au: 1 }, { it: "Marte 🔴", au: 1.52 },
        { it: "Fascia Asteroidi ☄️", au: 2.7 }, { it: "Giove 🟠", au: 5.2 },
        { it: "Saturno 🪐", au: 9.54 }, { it: "Urano 💎", au: 19.2 },
        { it: "Nettuno 🔵", au: 30.06 }
    ];

    const databaseStelle = {
        "sirio": 8.6, "vega": 25.0, "proxima": 4.24, "arturo": 36.7, 
        "polare": 433, "betelgeuse": 642, "rigel": 860, "antares": 550
    };

    function aggiorna() {
        const base = parseFloat(document.getElementById('valoreBase').value) || 0;
        const unita = document.getElementById('unita').value;
        const rapporto = base / AU_NETTUO;

        let html = "";
        corpi.forEach(c => {
            let d = (c.au * rapporto).toFixed(3);
            html += `<tr><td>${c.it}</td><td class="dist">${d} ${unita}</td></tr>`;
        });
        document.getElementById('tabellaPianeti').innerHTML = html;

        const inputNome = document.getElementById('nomeStella').value.toLowerCase().trim();
        const lyManuale = parseFloat(document.getElementById('lyManuale').value);
        const resDiv = document.getElementById('star-result');
        
        let ly = 0;
        let nomeVisualizzato = "";

        if (databaseStelle[inputNome]) {
            ly = databaseStelle[inputNome];
            nomeVisualizzato = inputNome.toUpperCase();
        } else if (lyManuale > 0) {
            ly = lyManuale;
            nomeVisualizzato = inputNome ? inputNome.toUpperCase() : "Oggetto personalizzato";
        }

        if (ly > 0) {
            let finale = (ly * ANNO_LUCE_IN_AU * rapporto);
            let testoDistanza = (unita === "m" && finale > 1000) ? (finale/1000).toLocaleString() + " km" : finale.toLocaleString() + " " + unita;
            resDiv.innerHTML = `⭐ <strong>${nomeVisualizzato}</strong> (${ly} a.l.)<br>Sarebbe a: <span style="font-size:1.4rem; color:#fff;">${testoDistanza}</span>`;
        } else {
            resDiv.innerHTML = "Scrivi un nome o inserisci gli Anni Luce manualmente.";
        }
    }
    aggiorna();
</script>
</body>
</html>
